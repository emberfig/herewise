# Builds Herewise on GitHub's Windows runners, from exactly the source in this repository.
#
# A tag v<version> builds a release; running it by hand ("Run workflow") builds the same files
# without making a release, which is how to check the build before tagging.
#
# Signing. When the repository has the secret SIGNPATH_API_TOKEN and the variable
# SIGNPATH_ORGANIZATION_ID, SignPath signs Herewise.exe before it is packed into the installer, then
# the installer. Each signing request waits for a person to approve it in SignPath. Without them the
# build still runs, unsigned, and no release is made, so the release runbook stays as it was.
#
# Nothing is published from here. A signed tag build makes a draft release; a person reads it, adds
# an upgrade paragraph if the register's schema changed, and publishes it.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write      # the draft release
  actions: read        # SignPath reads this run to confirm where the files came from

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "from rollcall import VERSION; print(VERSION)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "rollcall/__init__.py says $version, the tag says $GITHUB_REF_NAME"; exit 1; }

      - name: Test
        run: python -m pytest -q -p no:cacheprovider

      - name: Build the app folder
        run: python packaging/build.py --app

      - name: Upload the app folder for signing
        id: app-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: dist/Herewise/
          if-no-files-found: error

      - name: Sign Herewise.exe
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: herewise
          signing-policy-slug: release-signing
          artifact-configuration-slug: app-folder
          github-artifact-id: ${{ steps.app-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist/Herewise-signed

      - name: Put the signed app folder in place
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist/Herewise
          Move-Item dist/Herewise-signed dist/Herewise

      - name: Build the installer
        run: python packaging/build.py --installer

      - name: Upload the installer for signing
        id: installer-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: dist/Herewise-Setup-*.exe
          if-no-files-found: error

      - name: Sign the installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: herewise
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist/installer-signed

      - name: Put the signed installer in place, and check both signatures
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Get-ChildItem dist/installer-signed -Filter *.exe | Move-Item -Destination dist -Force
          Remove-Item -Recurse -Force dist/installer-signed
          foreach ($file in @("dist/Herewise/Herewise.exe") + (Get-ChildItem dist -Filter "Herewise-Setup-*.exe").FullName) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") { throw "$file is not validly signed: $($sig.Status) $($sig.StatusMessage)" }
            if (-not $sig.TimeStamperCertificate) { throw "$file is signed but not timestamped" }
            "signed: $file by $($sig.SignerCertificate.Subject)"
          }

      - name: Changelog, source archive and checksums
        run: python packaging/build.py --finish

      - name: Gather the release files
        shell: bash
        run: |
          version=$(python -c "from rollcall import VERSION; print(VERSION)")
          mkdir release
          cp "dist/Herewise-Setup-$version.exe" "dist/Herewise-$version-source.zip" release/
          (cd release && sha256sum "Herewise-Setup-$version.exe" "Herewise-$version-source.zip" | sed 's/ \*/  /' > SHA256SUMS.txt && cat SHA256SUMS.txt)
          python packaging/release_notes.py release-notes.md $([ -n "$SIGNPATH_API_TOKEN" ] && echo --signed)

      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/
            release-notes.md
          if-no-files-found: error

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "from rollcall import VERSION; print(VERSION)")
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Herewise $version" \
            --notes-file release-notes.md release/*
