<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Living sheet gallery</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    .gallery { padding: var(--hw-space-6) var(--hw-space-8); }
    .gallery__bar { display: flex; flex-wrap: wrap; gap: var(--hw-space-4); align-items: center; margin-block-end: var(--hw-space-6); }
    .gallery__bar h1 { margin: 0 auto 0 0; }
    .gallery__bar select { font: inherit; min-height: var(--hw-target-min); padding-inline: var(--hw-space-2);
      color: var(--hw-ink); background: var(--hw-surface); border: var(--hw-rule-width) solid var(--hw-rule-strong);
      border-radius: var(--hw-radius-control); }
    .gallery__panel { padding: var(--hw-space-6); border-radius: var(--hw-radius-card); margin-block-end: var(--hw-space-8);
      border: var(--hw-rule-width) solid var(--hw-rule); }
    .gallery__panel > h2 { margin: 0 0 var(--hw-space-4); font-size: var(--hw-text-caption); letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--hw-ink-muted); font-weight: var(--hw-weight-label); }
    .gallery__log { font-size: var(--hw-text-caption); color: var(--hw-ink-muted); min-height: 1.5em; }
    .gallery__panel hw-sheet { --sheet-max-height: 560px; }
  </style>
</head>
<body>
  <main class="gallery">
    <div class="gallery__bar">
      <h1 class="hw-display">Living sheet</h1>
      <label>State
        <select id="state">
          <option value="sheet-24">258 + 12 carry-over, 24 boxes, extra class warning</option>
          <option value="sheet-30">258 + 12 carry-over, 30 boxes</option>
          <option value="sheet-12">40 students, 12 single-class weeks</option>
          <option value="sheet-no-classes">No classes held yet</option>
          <option value="sheet-no-start">No week 1 start date</option>
          <option value="sheet-empty">No students</option>
          <option value="loading">Loading</option>
          <option value="error">Error</option>
        </select>
      </label>
      <label>Panels
        <select id="panels">
          <option value="light">Light</option>
          <option value="all">Light, dark and projection</option>
          <option value="dark">Dark</option>
          <option value="projection">Projection</option>
        </select>
      </label>
    </div>
    <p class="gallery__log" id="log" role="status">Open a box to see what the correction drawer would receive.</p>
    <div id="panels-host"></div>
  </main>

  <script type="module" src="sheet.js"></script>
</body>
</html>
